<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="toolbar">
        <a class="brand" href="/">Project Management</a>
        <nav>
            <a class="active" id="home-link" href="/">Home</a>
            <a id="profile-link" href="/profile">Profile</a>
            <a id="register-link" href="/register" hidden>Register</a>
            {% if session.get('is_admin') %}
            <a id="admin-link" href="/admin">User management</a>
            {% endif %}
            <button id="logout-button" type="button">Log out</button>
        </nav>
    </header>
    <main class="home-page"></main>
    <script src="{{ url_for('static', filename='account.js') }}"></script>
</body>
</html>
