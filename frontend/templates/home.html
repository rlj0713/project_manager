<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="toolbar">
        <a class="brand" href="/">Project Management</a>
        <nav>
            <a class="active" id="home-link" href="/">Home</a>
            <a id="profile-link" href="/profile">Profile</a>
            <a id="register-link" href="/register" hidden>Register</a>
            {% if session.get('is_admin') %}
            <a id="admin-link" href="/admin">User management</a>
            {% endif %}
            <button id="logout-button" type="button">Log out</button>
        </nav>
    </header>
    <main class="home-page">
        <section class="timeline-header">
            <div>
                <p class="eyebrow">Portfolio view</p>
                <h1>Project timeline</h1>
                <p>Track project work across time. Dark segments are complete; light segments are in progress.</p>
            </div>
            <label class="zoom-control" for="timeline-zoom">
                <span>Zoom</span>
                <input id="timeline-zoom" type="range" min="12" max="42" value="24">
            </label>
        </section>
        <section class="timeline-panel" aria-label="Project timeline">
            <div id="timeline-status" class="timeline-status">Loading projects...</div>
            <div id="timeline-scroll" class="timeline-scroll" hidden>
                <div id="timeline" class="timeline"></div>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='account.js') }}"></script>
    <script src="{{ url_for('static', filename='projects.js') }}"></script>
</body>
</html>
