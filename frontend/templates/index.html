<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management | Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="toolbar">
        <a class="brand" href="/">Project Management</a>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>
    <main class="splash-page">
        <h1>Project Management</h1>
        <p>Sign in to continue.</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <button type="submit">Sign in</button>
            <p id="login-message" role="status"></p>
        </form>
        <p id="session-message" role="status"></p>
        <a id="admin-link" href="/admin" hidden>Admin user management</a>
        <button id="logout-button" type="button" hidden>Log out</button>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
