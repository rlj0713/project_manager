<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Management | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="toolbar">
        <a class="brand" href="/">Project Management</a>
        <nav>
            <a id="home-link" href="/">Home</a>
            <a id="register-link" class="active" href="/register">Register</a>
            {% if session.get('is_admin') %}
            <a id="admin-link" href="/admin">User management</a>
            {% endif %}
            <button id="logout-button" type="button" hidden>Log out</button>
        </nav>
    </header>
    <main class="splash-page">
        <h1>Create an account</h1>
        <p>Register as a regular user.</p>
        <form id="register-form">
            <label for="username">Username</label>
            <input id="username" name="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <button type="submit">Register</button>
            <p id="register-message" role="status"></p>
        </form>
    </main>
    <script src="{{ url_for('static', filename='account.js') }}"></script>
    <script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
